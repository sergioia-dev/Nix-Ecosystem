set -g copy-command 'wl-copy'
set -g extended-keys 
set -g extended-keys-format csi-u
set -g set-clipboard on

# Display "SSH" in the status bar if the current pane is running ssh
set -g status-right "#{?pane_current_command==ssh,🔒 SSH ,💻 Local } | %H:%M"
set -g pane-active-border-style "#{?pane_current_command==ssh,fg=#ff0000,fg=#00ff00}"

set -g base-index 1          # Start window numbering at 1
# set -g status-style bg=black
# set -g status-style fg=white   

# Use vim-like keys for pane switching (with the leader key)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
set-window-option -g mode-keys vi



